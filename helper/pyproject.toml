[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rimworld-auto-translate-helper"
version = "0.047.0"
description = "Local offline translation helper for the RimWorld Auto Translate mod"
requires-python = ">=3.9"
dependencies = ["ctranslate2>=4.0", "sentencepiece>=0.2"]

[project.scripts]
rwtranslate = "rwtranslate.cli:main"

[tool.setuptools]
packages = ["rwtranslate"]
