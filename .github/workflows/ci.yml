name: CI
on: [push, pull_request]
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/set_version.py --check
  helper:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./helper
      - name: Tests (Linux, with a virtual display for the window tests)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb && xvfb-run -a python -I -m unittest discover -s helper/tests
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -I -m unittest discover -s helper/tests
  mod-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mono-mcs mono-devel
      - run: mod/tools/run-tests.sh
  mod-build-real-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet build mod/AutoTranslate.csproj -c Release -p:RimWorldDir=/nonexistent
  mod-build-17:
    # RimWorld 1.7 is still in beta (public reference package 1.7.x-alpha): this build is informational and never blocks the rest.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build mod/AutoTranslate17.csproj -c Release
